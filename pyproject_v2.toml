# <!-- v2 – Official 0.1-beta release manifest with canonical entrypoints and dependencies -->
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-transcriber"
version = "0.1.0b1"
description = "Universal Audio & Video Transcriber for macOS with Apple Silicon Metal GPU Acceleration, Acoustic Speaker Diarization, Local Media Dropzone, and Modular Playbooks"
readme = "README.md"
authors = [{ name = "Sean Tyler (@seanbuilds)", email = "ohheysean@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "jsonschema>=4.20.0",
    "python-docx>=1.1.0",
    "requests>=2.31.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "yt-dlp>=2024.0.0",
]

[project.urls]
Homepage = "https://github.com/seanbuilds/universal-transcriber"
Repository = "https://github.com/seanbuilds/universal-transcriber"
Documentation = "https://github.com/seanbuilds/universal-transcriber#readme"

[project.scripts]
transcribe = "cli:main"
transcriber-web = "app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
