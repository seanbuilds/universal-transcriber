<!DOCTYPE html>
<!-- v2 – Live SSE streaming telemetry, active speaker badges, and WebVTT/DOCX downloads -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Transcriber (v3)</title>
  <style>
    :root {
      --bg: #0f111a;
      --card: #1a1d2d;
      --border: #2b304d;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --success: #10b981;
      --active-spk: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 30px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 1050px; display: flex; flex-direction: column; gap: 24px; }
    .header { text-align: center; }
    .header h1 { font-size: 2rem; font-weight: 700; color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .header p { color: var(--muted); margin-top: 6px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
    .input-group { display: flex; flex-direction: column; gap: 12px; }
    .input-row { display: flex; gap: 12px; flex-wrap: wrap; }
    input[type="text"], select { background: #0f111a; border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; color: #fff; font-size: 0.95rem; outline: none; }
    input[type="text"]:focus, select:focus { border-color: var(--accent); }
    input[type="text"] { flex: 1; min-width: 280px; }
    button { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 12px 20px; font-weight: 600; cursor: pointer; transition: background 0.2s; font-size: 0.95rem; display: inline-flex; align-items: center; gap: 6px; }
    button:hover { background: var(--accent-hover); }
    button:disabled { background: var(--border); cursor: not-allowed; }
    .telemetry-header { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; flex-wrap: wrap; gap: 10px; }
    .speaker-badge { background: #1e293b; color: var(--active-spk); border: 1px solid #334155; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }
    .stage-badge { background: #0f172a; color: #34d399; border: 1px solid #064e3b; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; }
    .progress-bar-container { width: 100%; background: #0f111a; border-radius: 8px; height: 10px; overflow: hidden; margin-top: 12px; display: none; }
    .progress-bar { width: 0%; height: 100%; background: var(--accent); transition: width 0.3s; }
    .status-text { font-size: 0.9rem; color: var(--muted); margin-top: 8px; }
    .streaming-window { background: #0b0d14; border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-top: 16px; height: 260px; overflow-y: auto; display: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 0.9rem; line-height: 1.6; }
    .segment-item { margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid #1a1e30; animation: fadeIn 0.3s ease-in; }
    .segment-ts { color: var(--accent); font-weight: 600; margin-right: 8px; font-family: monospace; }
    .segment-speaker { color: var(--active-spk); font-weight: 600; margin-right: 8px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
    .tabs { display: flex; gap: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .tab-btn { background: transparent; color: var(--muted); border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    .tab-btn.active { color: #fff; background: var(--border); }
    pre.output-view { background: #0b0d14; border: 1px solid var(--border); border-radius: 8px; padding: 16px; color: #cbd5e1; font-family: "SFMono-Regular", Menlo, Monaco, Consolas, monospace; font-size: 0.9rem; line-height: 1.5; max-height: 480px; overflow-y: auto; white-space: pre-wrap; }
    .actions-row { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎙️ Universal Transcriber (v3)</h1>
      <p>Apple Silicon Metal Streaming ASR, Parliamentary Roll-Call FSM & Multi-Format Exporters</p>
    </div>

    <div class="card">
      <div class="input-group">
        <label>Input Source (YouTube URL, Podcast RSS, or Local Audio/Video):</label>
        <div class="input-row">
          <input type="text" id="sourceInput" placeholder="https://www.youtube.com/watch?v=... or /Users/.../recording.mp4">
          <select id="playbookSelect">
            <option value="municipal_meetings">Municipal Meetings</option>
            <option value="general_speech">General Speech</option>
            <option value="interview_podcast">Interview & Podcast</option>
            <option value="corporate_meeting">Corporate Meeting</option>
            <option value="academic_lecture">Academic Lecture</option>
          </select>
          <select id="clusteringSelect">
            <option value="ahc">AHC Diarization (Two-Pass)</option>
            <option value="online">Online Leader Diarization</option>
          </select>
          <button id="startBtn" onclick="startTranscription()">Transcribe</button>
        </div>

        <div class="telemetry-header" id="telemetryHeader" style="display:none;">
          <span class="stage-badge" id="stageBadge">Stage: Initializing</span>
          <span class="speaker-badge" id="speakerBadge">Active Speaker: Detecting...</span>
        </div>

        <div class="progress-bar-container" id="progressContainer">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="status-text" id="statusText">Ready</div>

        <!-- Live Streaming ASR Window -->
        <div class="streaming-window" id="streamingWindow"></div>
      </div>
    </div>

    <div class="card" id="resultsCard" style="display:none;">
      <div class="tabs">
        <button class="tab-btn active" onclick="showTab('md')">Markdown</button>
        <button class="tab-btn" onclick="showTab('txt')">Plaintext</button>
        <button class="tab-btn" onclick="showTab('srt')">Subtitles (.srt)</button>
        <button class="tab-btn" onclick="showTab('vtt')">WebVTT (.vtt)</button>
      </div>
      <pre class="output-view" id="transcriptView"></pre>
      <div class="actions-row">
        <a id="downloadMd" download><button>Download .md</button></a>
        <a id="downloadTxt" download><button>Download .txt</button></a>
        <a id="downloadSrt" download><button>Download .srt</button></a>
        <a id="downloadVtt" download><button>Download .vtt</button></a>
        <a id="downloadDocx" download><button>Download .docx</button></a>
      </div>
    </div>
  </div>

  <script>
    let currentResult = null;
    let eventSource = null;

    async function startTranscription() {
      const source = document.getElementById("sourceInput").value.trim();
      const playbook = document.getElementById("playbookSelect").value;
      const clustering = document.getElementById("clusteringSelect").value;
      if (!source) return alert("Please enter a YouTube URL, RSS feed, or local file path.");

      const btn = document.getElementById("startBtn");
      const progContainer = document.getElementById("progressContainer");
      const progBar = document.getElementById("progressBar");
      const statusText = document.getElementById("statusText");
      const telemHeader = document.getElementById("telemetryHeader");
      const streamWin = document.getElementById("streamingWindow");

      btn.disabled = true;
      progContainer.style.display = "block";
      telemHeader.style.display = "flex";
      streamWin.style.display = "block";
      streamWin.innerHTML = "";
      progBar.style.width = "5%";
      statusText.innerText = "Connecting to streaming telemetry...";

      try {
        const resp = await fetch("/api/transcribe", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ source, playbook, clustering })
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || "Failed to initialize job");

        const jobId = data.job_id;
        statusText.innerText = `Job ${jobId} queued. Streaming live tokens...`;
        connectTelemetryStream(jobId);
      } catch (err) {
        statusText.innerText = `Error: ${err.message}`;
        progBar.style.width = "0%";
        btn.disabled = false;
      }
    }

    function connectTelemetryStream(jobId) {
      if (eventSource) eventSource.close();
      eventSource = new EventSource(`/api/stream/${jobId}`);

      const progBar = document.getElementById("progressBar");
      const statusText = document.getElementById("statusText");
      const stageBadge = document.getElementById("stageBadge");
      const spkBadge = document.getElementById("speakerBadge");
      const streamWin = document.getElementById("streamingWindow");
      const btn = document.getElementById("startBtn");

      eventSource.addEventListener("progress", (e) => {
        const data = JSON.parse(e.data);
        progBar.style.width = `${data.progress_pct}%`;
        statusText.innerText = data.stage_message;
        stageBadge.innerText = `Stage: ${data.stage_message}`;
      });

      eventSource.addEventListener("segment", (e) => {
        const seg = JSON.parse(e.data);
        if (seg.speaker) {
          spkBadge.innerText = `Active Speaker: ${seg.speaker}`;
        }
        const row = document.createElement("div");
        row.className = "segment-item";
        row.innerHTML = `<span class="segment-ts">[${seg.ts}]</span>` +
                        (seg.speaker ? `<span class="segment-speaker">${seg.speaker}:</span>` : "") +
                        `<span>${seg.text}</span>`;
        streamWin.appendChild(row);
        streamWin.scrollTop = streamWin.scrollHeight;
      });

      eventSource.addEventListener("completed", (e) => {
        const result = JSON.parse(e.data);
        progBar.style.width = "100%";
        statusText.innerText = `Completed! Transcripts saved to ${result.export_dir}`;
        stageBadge.innerText = "Stage: Complete";
        btn.disabled = false;
        eventSource.close();
        currentResult = result;
        renderResult(result);
      });

      eventSource.addEventListener("error", (e) => {
        try {
          if (e.data) {
            const err = JSON.parse(e.data);
            statusText.innerText = `Job error: ${err.error}`;
          }
        } catch (_) {}
      });
    }

    async function renderResult(data) {
      document.getElementById("resultsCard").style.display = "block";
      const resp = await fetch(`/api/file?path=${encodeURIComponent(data.files.txt)}`);
      const txt = await resp.text();
      document.getElementById("transcriptView").innerText = txt;

      document.getElementById("downloadMd").href = `/api/file?path=${encodeURIComponent(data.files.md)}&download=1`;
      document.getElementById("downloadTxt").href = `/api/file?path=${encodeURIComponent(data.files.txt)}&download=1`;
      document.getElementById("downloadSrt").href = `/api/file?path=${encodeURIComponent(data.files.srt)}&download=1`;
      document.getElementById("downloadVtt").href = `/api/file?path=${encodeURIComponent(data.files.vtt)}&download=1`;
      document.getElementById("downloadDocx").href = `/api/file?path=${encodeURIComponent(data.files.docx)}&download=1`;
    }

    async function showTab(fmt) {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      event.target.classList.add("active");
      if (!currentResult) return;
      const resp = await fetch(`/api/file?path=${encodeURIComponent(currentResult.files[fmt])}`);
      const content = await resp.text();
      document.getElementById("transcriptView").innerText = content;
    }
  </script>
</body>
</html>
