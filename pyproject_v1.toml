[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-transcriber"
version = "1.0.0"
description = "Universal Audio & Video Transcriber for macOS with Apple Silicon Metal GPU Acceleration, Persistent Speaker Diarization, and Modular Playbooks"
readme = "README_v1.md"
authors = [{ name = "Sean", email = "ohheysean@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.0.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
]

[project.scripts]
transcribe = "cli_v1:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
